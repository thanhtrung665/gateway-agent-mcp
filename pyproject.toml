[project]
name = "sota-agw-mcp"
version = "0.8.0"
description = "SOTA Agentic Gateway — lõi dùng chung (agw_core), remote MCP cho API SaaS (agw_remote_mcp) và Claude plugin / MCP cục bộ"
readme = "README.md"
requires-python = ">=3.11"
# agw_core chỉ import thư viện ngoài khi cần (lười) → gói gốc không bắt buộc phụ thuộc nào
dependencies = []

[project.optional-dependencies]
docs = ["python-docx>=1.1", "openpyxl>=3.1", "pdfplumber>=0.11", "beautifulsoup4>=4.12"]
remote = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.9", "requests>=2.31"]  # requests: plugin agw_mcp.py (PEP 723). Cài kèm extra: uv sync --all-extras

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agw_core", "agw_remote_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
